name: Build & Publish Desktop Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing version tag to build and publish (for example v2.1.1)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Desktop App
    runs-on: windows-latest
    env:
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
      # Whisper's nested CMake/MSBuild shader paths can exceed MAX_PATH otherwise.
      CARGO_TARGET_DIR: C:\t

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Install Vulkan SDK
        shell: pwsh
        env:
          VULKAN_VERSION: '1.4.363.0'
          VULKAN_SHA256: '94a82d378f7a5e3e54c9db7d2fb7016af136e14ac0a18dbf0f2f67a36352d141'
        run: |
          $ErrorActionPreference = 'Stop'
          $sdkRoot = Join-Path $env:RUNNER_TEMP "VulkanSDK\$env:VULKAN_VERSION"
          $installer = Join-Path $env:RUNNER_TEMP 'vulkan-sdk-installer.exe'
          $url = "https://sdk.lunarg.com/sdk/download/$env:VULKAN_VERSION/windows/vulkansdk-windows-X64-$env:VULKAN_VERSION.exe"
          Invoke-WebRequest -Uri $url -OutFile $installer
          $actualHash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash
          if ($actualHash -ne $env:VULKAN_SHA256) {
            throw "Vulkan SDK checksum mismatch: $actualHash"
          }
          $install = Start-Process -FilePath $installer -ArgumentList @(
            '--root', "`"$sdkRoot`"", '--accept-licenses', '--default-answer',
            '--confirm-command', 'install', 'copy_only=1'
          ) -Wait -PassThru -WindowStyle Hidden
          if ($install.ExitCode -ne 0) {
            throw "Vulkan SDK installation failed with exit code $($install.ExitCode)"
          }
          foreach ($file in @('Include\vulkan\vulkan.h', 'Lib\vulkan-1.lib', 'Bin\glslc.exe')) {
            if (-not (Test-Path -LiteralPath (Join-Path $sdkRoot $file))) {
              throw "Vulkan SDK installation is incomplete: $file"
            }
          }
          "VULKAN_SDK=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VK_SDK_PATH=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          (Join-Path $sdkRoot 'Bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting, lint and tests
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test --lib

      - name: Build release executable
        run: cargo build --release

      - name: Download FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3
        id: ffmpeg
        with:
          ffmpeg-version: release

      - name: Package
        shell: pwsh
        run: |
          $dist = "dist/LoopKaraokeStudio"
          New-Item -ItemType Directory -Force "$dist/assets" | Out-Null
          Copy-Item "$env:CARGO_TARGET_DIR/release/loopkaraoke-studio.exe" "$dist/LoopKaraokeStudio.exe"
          Copy-Item -Recurse assets/effects "$dist/assets/effects"
          $ffmpegDir = Split-Path (Get-Command ffmpeg).Source
          Copy-Item "$ffmpegDir/ffmpeg.exe", "$ffmpegDir/ffprobe.exe" $dist
          Compress-Archive -Path $dist -DestinationPath dist/LoopKaraokeStudio-Windows-x64.zip

      - name: Create GitHub Release & Upload Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: "LoopKaraoke Studio ${{ inputs.release_tag || github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: dist/LoopKaraokeStudio-Windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
