[package]
name = "loopkaraoke-studio"
version = "2.0.1"
edition = "2021"
rust-version = "1.85"
description = "Loop video backgrounds, merge songs and burn word-by-word karaoke lyrics"
publish = false

[lib]
name = "loopkaraoke"
path = "src/lib.rs"

[[bin]]
name = "loopkaraoke-studio"
path = "src/main.rs"

[features]
default = []
cuda = ["whisper-rs/cuda"]
vulkan = ["whisper-rs/vulkan"]

[dependencies]
ab_glyph = "0.2.32"
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
eframe = "0.32.3"
egui_extras = { version = "0.32.3", features = ["file", "image"] }
image = { version = "0.25.9", default-features = false, features = ["jpeg", "png"] }
imageproc = "0.25.1"
rand = "0.8.5"
regex = "1.13.1"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "process", "fs", "io-util", "net", "sync", "time"] }
ureq = "3.4.2"
uuid = { version = "1.26.1", features = ["v4"] }
whisper-rs = "0.16.0"
zip = { version = "7.2.0", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
